{% extends "base.html" %}

{% block titulo %}Iniciar Sesion{% endblock %}

{% block contenido %}

<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="card-title mb-4 text-center">Iniciar Sesion</h2>

        <form method="POST" action="{{ url_for('login') }}">

          <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="usuario" name="usuario" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">
              Contrasena
              <!-- Componente extra: tooltip de Bootstrap -->
              <span data-bs-toggle="tooltip" data-bs-placement="right" title="Usuario de prueba: admin / Contrasena: 1234">
                &#9432;
              </span>
            </label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>

          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="recordarme" name="recordarme">
            <label class="form-check-label" for="recordarme">Recordarme</label>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Entrar</button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>

<!-- Script para activar los tooltips de Bootstrap -->
<script>
var tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
var tooltipList = [...tooltipTriggerList].map(el => new bootstrap.Tooltip(el));
</script>

{% endblock %}
